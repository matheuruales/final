{% extends "base.html" %}

{% block title %}Acceso restringido{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h4 mb-3">No tienes permisos para acceder aqui</h1>
                <p class="text-muted mb-4">Vuelve al panel principal o contacta a un docente administrador si crees que esto es un error.</p>

            </div>
        </div>
    </div>
</div>
{% endblock %}
