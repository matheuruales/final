{% extends "base.html" %}

{% block title %}Eliminar proyecto{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <a href="{% url 'proyecto_detalle' object.pk %}" class="text-decoration-none small">&larr; Volver al detalle</a>
                <h1 class="h3 mt-2">Eliminar proyecto</h1>
                <p class="text-muted">
                    Esta accion eliminara el proyecto <strong>{{ object.titulo }}</strong> y sus comentarios asociados.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Confirmar eliminacion</button>
                        <a href="{% url 'proyecto_detalle' object.pk %}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
